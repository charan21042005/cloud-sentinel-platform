apiVersion: batch/v1
kind: Job
metadata:
  name: traffic-generator-phase-7v
  namespace: sentinel-apps
  labels:
    app.kubernetes.io/name: traffic-generator
    app.kubernetes.io/component: bounded-smoke-test
spec:
  # Require a later explicit patch after the image digest and live baseline are reviewed.
  suspend: true
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 60
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-generator
        app.kubernetes.io/component: bounded-smoke-test
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 5
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traffic-generator
          # Replace with a digest built from the reviewed bounded source before unsuspending.
          image: 434504869339.dkr.ecr.us-east-1.amazonaws.com/cloud-sentinel-prod-traffic-generator@sha256:b20afb140569b574003e34d6b14e2053b77698ee1a3524ddcd47bf1403019f78
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: API_URL
              value: "http://api-gateway-svc.sentinel-apps.svc.cluster.local:8000"
            - name: MAX_DURATION_SECONDS
              value: "30"
            - name: MAX_REQUESTS
              value: "10"
            - name: REQUEST_TIMEOUT_SECONDS
              value: "3"
            - name: CONCURRENCY
              value: "2"
            - name: RANDOM_SEED
              value: "7"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
