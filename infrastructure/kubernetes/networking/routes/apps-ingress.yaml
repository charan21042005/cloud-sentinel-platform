apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinel-apps-ingress
  namespace: sentinel-apps
  labels:
    app.kubernetes.io/part-of: cloud-sentinel
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - host: sentinel.ops.internal
      http:
        paths:
          # Real-Time WebSocket Transport Tier
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: api-gateway-svc
                port:
                  number: 8000
                  
          # RESTful Operational Endpoints
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway-svc
                port:
                  number: 8000
                  
          # Frontend UI Dashboard Operations Console
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 80
